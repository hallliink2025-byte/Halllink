<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halllink</title>
    <link rel="stylesheet" href="./styles/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Krona+One&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="cabecalho">
      <img src="favicon.jpg" class="logo" alt="Logo" />

      <div class="menu">
        <input type="checkbox" id="menu" class="menu__botao" />

        <label for="menu" class="menu__icone">
          <span></span>
        </label>

        <ul class="menu__lista">
          <li class="menu__lista__titulo">Fale conosco</li>
          <li class="menu__lista__item">
            <a class="menu__lista__link" href="#">WhatsApp</a>
          </li>
          <li class="menu__lista__item">
            <a class="menu__lista__link" href="#">Instagram</a>
          </li>
        </ul>
      </div>
    </header>
    <main class="hero">
      <h1 class="hero__titulo">
        <span class="linha1">Gestão</span>
        <span class="linha2">inteligente</span>
        <span class="linha3">para condomios</span>
      </h1>
      <hr>
      <p class="hero__texto">
        A HallLink conecta seu condomínio aos fornecedores certos, organiza
        demandas de manutenção e ajuda o síndico a ganhar mais agilidade e
        praticidade no dia a dia.
      </p>
    </main>
  </body>
</html>
