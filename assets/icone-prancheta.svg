  <!-- Presilha superior -->
  <path d="M 43,32 L 43,26 C 43,24.5 44.5,23 46,23 L 54,23 C 55.5,23 57,24.5 57,26 L 57,32" stroke="#FFCC00" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Linhas de texto internas -->
  <line x1="40" y1="43" x2="60" y2="43" stroke="#FFCC00" stroke-width="5" stroke-linecap="round" />
  <line x1="40" y1="53" x2="50" y2="53" stroke="#FFCC00" stroke-width="5" stroke-linecap="round" />
  
  <!-- Círculo do Check isolado no canto inferior direito -->
  <circle cx="68" cy="68" r="14" stroke="#FFCC00" stroke-width="6" fill="none" />
  <path d="M 62,68 L 66,72 L 74,64" stroke="#FFCC00" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
