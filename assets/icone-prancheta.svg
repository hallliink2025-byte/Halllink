<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <!-- Círculo externo principal -->
  <circle cx="50" cy="50" r="42" stroke="#FFCC00" stroke-width="6" fill="none" />
  
  <!-- Corpo da Prancheta (linhas interrompidas para não cruzar o círculo do check) -->
